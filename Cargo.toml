[workspace]
resolver = "2"
members = [
    "crates/goodwrite-core",
    "crates/goodwrite-extract",
    "crates/goodwrite-tokenize",
    "crates/goodwrite-asd-ste100",
    "crates/goodwrite-ears",
    "crates/goodwrite-glossary",
    "crates/goodwrite-lsp",
    "crates/goodwrite-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/walkerbrown/goodwrite"
authors = ["Dylan Walker Brown"]
description = "Linter and language server for engineering documentation in Typst and Markdown"
categories = ["command-line-utilities", "development-tools"]
keywords = ["linter", "documentation", "typst", "markdown"]

[workspace.dependencies]
goodwrite-core = { path = "crates/goodwrite-core" }
goodwrite-extract = { path = "crates/goodwrite-extract" }
goodwrite-tokenize = { path = "crates/goodwrite-tokenize" }
goodwrite-asd-ste100 = { path = "crates/goodwrite-asd-ste100" }
goodwrite-ears = { path = "crates/goodwrite-ears" }
goodwrite-glossary = { path = "crates/goodwrite-glossary" }

glob = "0.3"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
miette = { version = "7", features = ["fancy"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
similar = "2"
pulldown-cmark = "0.10"
typst-syntax = "0.13"
regex = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-std"] }
indicatif = "0.18"
