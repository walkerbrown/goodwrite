name: python

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpoppler-cpp-dev pkg-config python3-dev

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r crates/goodwrite-asd-ste100/scripts/requirements.txt
          uv pip install ruff ty

      - name: Run Python lints
        run: ./scripts/ci/run.sh python
