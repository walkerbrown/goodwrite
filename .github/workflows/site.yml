name: site

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install html5validator
        run: pip install html5validator

      - name: Validate site
        run: ./scripts/ci/run.sh site --channel stable
