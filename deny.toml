[advisories]
version = 2
# TODO RUSTSEC-2025-0119 file upstream PR to move off unmaintained number_prefix 0.4.0
ignore = ["RUSTSEC-2025-0119"]

[licenses]
version = 2
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "0BSD",
  "ISC",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
